# Real human conversation feasibility pilot. No calendar labels, teacher or TTS.
experiment_kind: conversation_pilot
max_effective_epochs: 2
train:
  rank: 8
  alpha: 8
  layers: [28, 29, 30, 31]
  lr: 0.00001
  accumulation: 4
  max_frames: 750
  max_steps: 64 # Ceiling only; actual steps derive from unique exposure.
  checkpoint_every: 4
  wandb_mode: disabled
  seed: 101
