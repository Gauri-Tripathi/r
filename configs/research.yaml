# Research experiment; requires checked external teacher data and audible baseline.
# Same selective LoRA; steps are derived from data exposure and measured time.
experiment_kind: research
groups: 100
seed: 101
min_train_examples: 64
max_effective_epochs: 2
train:
  rank: 8
  alpha: 8
  layers: [28, 29, 30, 31]
  lr: 0.00001
  accumulation: 4
  max_frames: 750
  max_steps: 500 # Safety ceiling, not a requested workload.
  checkpoint_every: 15
  post_event_weight: 1.0
  text_pad_weight: 0.1
  replay_frame_fraction: 0.15
  wandb_mode: offline
